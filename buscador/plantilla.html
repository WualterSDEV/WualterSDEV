<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Recetas</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --line:#e3dfd7;
  --accent:#8a3b12; --accent-ink:#ffffff; --soft:#f3e7df; --chip:#efece6; --ok:#2f6b3a; --hl:#fff4d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --panel:#201f1c; --ink:#ece8e1; --muted:#a29b90; --line:#36332e;
    --accent:#e08a5a; --accent-ink:#1a1310; --soft:#3a2a20; --chip:#2b2925; --ok:#7fc28c; --hl:#3b3420;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --panel:#201f1c; --ink:#ece8e1; --muted:#a29b90; --line:#36332e;
  --accent:#e08a5a; --accent-ink:#1a1310; --soft:#3a2a20; --chip:#2b2925; --ok:#7fc28c; --hl:#3b3420;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px 16px 8px;max-width:1280px;margin:0 auto;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:8px 16px 32px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
input[type=search]{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.filters button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.opt{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:6px}
select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;margin-bottom:8px}
#count{font-size:12px;color:var(--muted);margin:4px 0}
#results{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto;border-top:1px solid var(--line)}
#results li{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
#results li:hover,#results li.active{background:var(--soft)}
#results .nm{flex:1;min-width:0}
#results .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
#results .nm small{color:var(--muted);font-size:12px}
.add{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;width:30px;height:30px;font-size:18px;cursor:pointer;flex:none}
.add.on{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-right:4px}
.tag.c{background:var(--soft);color:var(--accent)}
.sel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sel-head h2,.panel h2{font-size:16px;margin:0}
#sel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
#sel span{background:var(--chip);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;display:flex;align-items:center;gap:4px}
#sel span button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#preview{margin-top:16px}
.rec-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.rec-h h3{margin:0;font-size:18px}
.meta{color:var(--muted);font-size:13px;margin:4px 0 10px}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
details{margin:2px 0}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
details>summary::before{content:"▸ ";}
details[open]>summary::before{content:"▾ ";}
.nest{border-left:3px solid var(--soft);padding-left:10px;margin:6px 0 8px}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
mark{background:var(--hl);color:inherit}
.theme{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Buscador de Recetas</h1>
  <p>Inforest 2026 · <span id="tot"></span> recetas · Excel en formato Odoo, en gramos · funciona sin internet</p>
  <button class="theme" id="theme" title="Cambiar tema">◐ Tema</button>
</header>
<main>
  <section class="panel" aria-label="Buscar">
    <input type="search" id="q" placeholder="Busca un plato, receta o código…" autocomplete="off" autofocus>
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">Todas</button>
      <button data-f="carta" aria-pressed="false">Carta (fotos)</button>
      <button data-f="postre" aria-pressed="false">Postres</button>
      <button data-f="Venta" aria-pressed="false">Recetas venta</button>
      <button data-f="Base" aria-pressed="false">Recetas base</button>
    </div>
    <select id="cat"><option value="">Todas las categorías</option></select>
    <label class="opt"><input type="checkbox" id="byIng"> Buscar también por insumo (ej. "lucuma")</label>
    <div id="count"></div>
    <ul id="results"></ul>
  </section>

  <section class="panel" aria-label="Selección y vista">
    <div class="sel-head">
      <h2>Seleccionadas (<span id="nsel">0</span>)</h2>
      <div class="actions">
        <label class="opt" style="margin:0"><input type="checkbox" id="incBase" checked> Incluir recetas base</label>
        <button class="btn sec" id="addAll">Agregar resultados</button>
        <button class="btn sec" id="clear">Limpiar</button>
        <button class="btn" id="export" disabled>Descargar Excel</button>
      </div>
    </div>
    <div id="sel"></div>
    <div id="preview"><div class="empty">Elige una receta de la lista para verla aquí. Usa <b>+</b> para agregarla al Excel.</div></div>
  </section>
</main>

<script>/*XLSX*/</script>
<script>
const DATA = /*DATA*/;
const BY = Object.fromEntries(DATA.map(r => [r.id, r]));
const $ = s => document.querySelector(s);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
DATA.forEach(r => { r._n = norm(r.n + ' ' + r.cod + ' ' + (r.carta ? r.carta[1] : '')); r._i = norm(r.it.map(i => i[0]).join(' | ')); });
const sel = new Set(); let filter = 'all', active = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (x, d = 2) => x == null || x === '' ? '' : Number(x).toLocaleString('es-PE', {maximumFractionDigits: d});

$('#tot').textContent = DATA.length;
[...new Set(DATA.map(r => r.cat).filter(Boolean))].sort().forEach(c => $('#cat').insertAdjacentHTML('beforeend', `<option>${esc(c)}</option>`));

function matches() {
  const toks = norm($('#q').value).split(/\s+/).filter(Boolean), cat = $('#cat').value, ing = $('#byIng').checked;
  return DATA.filter(r => {
    if (filter === 'carta' && !r.carta) return false;
    if (filter === 'postre' && !r.postre) return false;
    if ((filter === 'Venta' || filter === 'Base') && r.t !== filter) return false;
    if (cat && r.cat !== cat) return false;
    return toks.every(t => r._n.includes(t) || (ing && r._i.includes(t)));
  }).sort((a, b) => (!!b.carta - !!a.carta) || (a.t > b.t ? -1 : a.t < b.t ? 1 : 0) || a.n.localeCompare(b.n));
}
function hl(text) {
  const toks = norm($('#q').value).split(/\s+/).filter(Boolean); if (!toks.length) return esc(text);
  const n = norm(text); const mark = new Array(text.length).fill(false);
  toks.forEach(t => { let i = n.indexOf(t); while (i >= 0) { for (let k = i; k < i + t.length; k++) mark[k] = true; i = n.indexOf(t, i + 1); } });
  let out = '', on = false;
  for (let i = 0; i < text.length; i++) { if (mark[i] !== on) { out += mark[i] ? '<mark>' : '</mark>'; on = mark[i]; } out += esc(text[i]); }
  return out + (on ? '</mark>' : '');
}
function renderList() {
  const m = matches(); $('#count').textContent = `${m.length} resultado${m.length === 1 ? '' : 's'}`;
  $('#results').innerHTML = m.slice(0, 400).map(r => `<li data-id="${r.id}" class="${r.id === active ? 'active' : ''}">
      <div class="nm"><b>${hl(r.n)}</b><small>${r.carta ? `<span class="tag c">Carta: ${esc(r.carta[1])}</span>` : ''}<span class="tag">${r.t}</span>${esc(r.cod)} · ${esc(r.cat || r.area)}${r.pv ? ' · S/ ' + num(r.pv) : ''}</small></div>
      <button class="add ${sel.has(r.id) ? 'on' : ''}" data-add="${r.id}" title="${sel.has(r.id) ? 'Quitar' : 'Agregar'} al Excel">${sel.has(r.id) ? '✓' : '+'}</button></li>`).join('')
    || '<li class="empty">Sin resultados. Prueba con otra palabra o activa "Buscar también por insumo".</li>';
}
function renderSel() {
  $('#nsel').textContent = sel.size; $('#export').disabled = !sel.size;
  $('#sel').innerHTML = [...sel].map(id => `<span>${esc(BY[id].n)}<button data-rm="${id}" title="Quitar">×</button></span>`).join('');
}
function itemsTable(r, depth, seen) {
  const rows = r.it.map(i => {
    const sub = i[6] && BY[i[6]];
    const name = sub && depth < 6 && !seen.has(sub.id)
      ? `<details><summary>${esc(i[0])}</summary><div class="nest">${itemsTable(sub, depth + 1, new Set([...seen, sub.id]))}<div class="meta">Rinde: ${num(sub.f)} ${esc(sub.up || '')} · Costo: S/ ${num(sub.costo)}</div></div></details>`
      : esc(i[0]) + (i[1] === 'Receta' && !sub ? ' <span class="tag">sin receta en Inforest</span>' : '');
    return `<tr><td>${name}${i[7] ? ` <span class="tag">${esc(i[7])}</span>` : ' <span class="tag c">sin código Odoo</span>'}</td><td>${esc(i[1])}</td><td class="n">${num(i[2], 4)}</td><td>${esc(i[3])}</td><td class="n">${num(i[4])}</td><td class="n">${num(i[5], 4)}</td></tr>`;
  }).join('');
  return `<div class="tbl"><table><thead><tr><th>Insumo</th><th>Tipo</th><th class="n">Cantidad</th><th>Unidad</th><th class="n">Precio</th><th class="n">Subtotal</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderPreview() {
  const r = BY[active]; if (!r) return;
  $('#preview').innerHTML = `<div class="rec-h"><div><h3>${esc(r.n)}</h3>
    <div class="meta">${r.t === 'Venta' ? 'Receta de venta' : 'Receta base'} · Código ${esc(r.cod)} · ${esc(r.cat)} · ${esc(r.area)}
    ${r.carta ? `<br>En carta: <b>${esc(r.carta[1])}</b> (${esc(r.carta[0])}, S/ ${num(r.carta[2])})` : ''}
    ${r.pv ? `<br>Precio venta Inforest: S/ ${num(r.pv)}` : ''}${r.t === 'Base' ? `<br>Rinde: ${num(r.f)} ${esc(r.up || '')}` : ''}${r.oid ? ` · Código Odoo: <b>${esc(r.oid)}</b>` : ' · <span class="tag">sin código en Odoo</span>'} · Costo total: S/ ${num(r.costo)}</div></div>
    <div class="actions"><button class="btn sec" data-add="${r.id}">${sel.has(r.id) ? 'Quitar de la selección' : 'Agregar a la selección'}</button>
    <button class="btn" data-one="${r.id}">Excel solo de esta</button></div></div>
    ${itemsTable(r, 0, new Set([r.id]))}`;
}
function toggle(id) { sel.has(id) ? sel.delete(id) : sel.add(id); renderSel(); renderList(); if (active) renderPreview(); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-add]'); if (a) { e.stopPropagation(); toggle(a.dataset.add); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { toggle(rm.dataset.rm); return; }
  const one = e.target.closest('[data-one]'); if (one) { exportXlsx([one.dataset.one]); return; }
  const li = e.target.closest('#results li[data-id]'); if (li) { active = li.dataset.id; renderList(); renderPreview(); }
  const f = e.target.closest('#filters button'); if (f) { filter = f.dataset.f; document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', b === f)); renderList(); }
});
['#q', '#cat', '#byIng'].forEach(s => $(s).addEventListener('input', renderList));
$('#clear').onclick = () => { sel.clear(); renderSel(); renderList(); if (active) renderPreview(); };
$('#addAll').onclick = () => { matches().forEach(r => sel.add(r.id)); renderSel(); renderList(); if (active) renderPreview(); };
$('#export').onclick = () => exportXlsx([...sel]);
$('#theme').onclick = () => { const d = document.documentElement, cur = d.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); d.dataset.theme = cur === 'dark' ? 'light' : 'dark'; };

function exportXlsx(ids) {
  const incBase = $('#incBase').checked;
  // Orden para importar en Odoo: primero las recetas base (las más internas primero), luego las elegidas
  const order = [], seen = new Set(), usedIn = new Map();
  const visit = (r, parent) => r.it.forEach(i => {
    const s = i[6] && BY[i[6]]; if (!s || s.id === r.id) return;
    if (!usedIn.has(s.id)) usedIn.set(s.id, new Set());
    usedIn.get(s.id).add(parent);
    if (seen.has(s.id)) return; seen.add(s.id); visit(s, s.n); order.push(s.id);
  });
  ids.forEach(id => { seen.add(id); visit(BY[id], BY[id].n); });
  const list = [...(incBase ? order.filter(id => !ids.includes(id)) : []), ...ids].map(id => BY[id]);
  const HEAD = ['Producto/id', 'Producto/nombre', 'Tipo de lista de materiales', 'Cantidad', 'Unidad de medida',
    'Líneas de la lista de materiales/Componente/Referencia interna', 'Líneas de la lista de materiales/Componente/Nombre', 'Líneas de la lista de materiales/Cantidad'];
  const ok = [HEAD], pend = [HEAD], rev = [['Qué falta', 'Nombre', 'Usado en', 'Qué hacer']], revSeen = new Set();
  const issue = (q, n, u, d) => { const k = q + '|' + n; if (revSeen.has(k)) { const row = rev.find(x => x[0] === q && x[1] === n); if (u && !row[2].split(', ').includes(u)) row[2] += (row[2] ? ', ' : '') + u; return; } revSeen.add(k); rev.push([q, n, u || '', d]); };
  list.forEach(r => {
    const qty = r.t === 'Venta' ? 1 : (r.f ?? 1);
    const ready = r.oid && r.it.every(i => i[7]);
    if (!r.oid) issue('Producto (receta) no existe en Odoo', r.n, '', `Crear el producto en Odoo y poner su código en la columna A de "Pendientes" (Inforest ${r.cod})`);
    if (r.t === 'Base' && r.f == null) issue('Receta sin rinde en Inforest', r.n, '', 'Revisar la cantidad (columna D)');
    const dest = ready ? ok : pend;
    if (!r.it.length) dest.push([r.oid || '', r.n, 'Fabricar este producto', qty, r.up || '', '', '', '']);
    r.it.forEach((i, k) => {
      if (!i[7]) issue('Insumo sin código en Odoo', i[0], r.n, 'Crear o buscar el insumo en Odoo y poner su código en la columna F');
      dest.push([...(k ? ['', '', '', ''] : [r.oid || '', r.n, 'Fabricar este producto', qty]), i[3], i[7] || '', i[0], i[2]]);
    });
  });
  const wb = XLSX.utils.book_new();
  const add = (aoa, name, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(w => ({wch: w})); XLSX.utils.book_append_sheet(wb, ws, name); };
  const W = [11, 36, 22, 10, 13, 14, 40, 10];
  add(ok, 'Listo para subir', W);
  if (pend.length > 1) add(pend, 'Pendientes', W);
  if (rev.length > 1) add(rev, 'Revisar antes de subir', [34, 40, 50, 70]);
  const d = new Date(), ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const base = ids.length === 1 ? BY[ids[0]].n : `${ids.length}_recetas`;
  XLSX.writeFile(wb, `Odoo_${base.replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_|_$/g, '')}_${ds}.xlsx`);
}
renderList(); renderSel();
</script>
</body>
</html>
